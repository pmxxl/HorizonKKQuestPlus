  # ========== 探索类 ==========
  探索主城:
    type: explore
    level: rlp
    target: "spawn"              # 目标区域名
    target_amount: 1             # 到达即完成
    rewards:
      - "xpls:30"
    time_limit: 1
    description: "&f前往 &a主城 &f广场"
    repeatable: false

  # ========== 护送类 ==========
  护送商人:
    type: escort
    level: dlp
    target: "merchant_npc"       # 目标NPC ID
    target_amount: 1
    rewards:
      - "zpls:15"
      - "item:灵晶:1"
    time_limit: 1
    description: "&f护送商人安全到达目的地"
    repeatable: false

  # ========== 高级悬赏 ==========
  猎杀凋零:
    type: hunt
    level: tlp
    target: "WITHER"
    target_amount: 1
    rewards:
      - "jpls:50"
      - "item:龙鳞:3"
      - "cmd:title %player% title {\"text\":\"屠龙勇士\",\"color\":\"gold\"}|console"
    time_limit: 0               # 0=无时间限制
    description: "&f猎杀 &c凋零 &f×1"
    repeatable: false
    messages:
      accepted: "&c&l天级悬赏! 猎杀凋零!"
      completed: "&6&l恭喜! 成功猎杀凋零!"

# ============================================
# HorizonKKQuestPlus - 悬赏系统配置文件
# ============================================

# ==================== 灵石货币定义 ====================
# key → NI物品ID (通过NeigeItems发放)
stone_types:
  xpls: "下品灵石"
  zpls: "中品灵石"
  spls: "上品灵石"
  jpls: "极品灵石"

# ==================== 灵石转换阈值 ====================
# 以下品灵石为单位，当奖励价值达到阈值时才转换为更高品灵石
# 例如: threshold_mid: 64 表示价值 >= 64 下品灵石时才给中品灵石
stone_thresholds:
  mid: 64           # 中品灵石阈值 (默认64，即2个中品灵石的价值)
  high: 2048        # 上品灵石阈值 (默认2048，即2个上品灵石的价值)
  top: 65536        # 极品灵石阈值 (默认65536，即2个极品灵石的价值)

# ==================== 悬赏令物品外观 ====================
# {reward} 占位符会被替换为奖励列表（每行一个奖励）
# 奖励格式: 奖励名称 &a×数量
item:
  # 人级悬赏
  rlp:
    custommodel: 10168
    name: '&f悬赏令 &2[&a人级&2]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'
  # 玄级悬赏
  xlp:
    custommodel: 10170
    name: '&f悬赏令 &3[&b玄级&3]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'
  # 地级悬赏
  dlp:
    custommodel: 10167
    name: '&f悬赏令 &5[&d地级&5]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'
  # 天级悬赏
  tlp:
    custommodel: 10169
    name: '&f悬赏令 &6[&e天级&6]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'

# ==================== 主菜单配置 ====================
menu:
  size: 27
  # 三个按钮槽位
  public_slot: 11          # 公共悬赏 - 全服共享的委托
  accepted_slot: 13        # 已接取的悬赏
  my_published_slot: 15    # 我发布的悬赏

# ==================== 公共悬赏定时发布 ====================
public_quests:
  interval: 3600           # 发布间隔(秒), 默认1小时
  count: 3                 # 每次发布数量

# ==================== 收集任务随机配置 ====================
random_collect:
  enabled: true            # 是否启用随机收集任务
  min_amount: 5            # 最小收集数量 (单个物品)
  max_amount: 50           # 默认最大收集数量 (单个物品)
  count: 2                 # 每次定时发布时，随机收集任务的数量
  # 等级权重 (控制各等级出现概率)
  level_weights:
    rlp: 40              # 人级权重
    xlp: 30            # 玄级权重
    dlp: 20              # 地级权重
    tlp: 10                # 天级权重

# ==================== 价值定义 ====================
# 定义价值常量，供 collect_items 引用
# 使用 @名称 来引用，如: value: "@1jie"
values:
  1jie: 4
  2jie: 8
  3jie: 16
  4jie: 32
  5jie: 64
  6jie: 128
  7jie: 256
  8jie: 512
  9jie: 1024

# ==================== 可收集物品及价值 ====================
# 物品ID → 配置
# 价值决定任务等级:
#   value < 50   → 人级
#   50 ≤ v < 200 → 玄级
#   200 ≤ v < 500 → 地级
#   v ≥ 500      → 天级
#
# 配置格式:
#   完整格式:
#     物品ID:
#       value: 数值 或 "@价值别名"
#       max_amount: 最大数量 (可选，默认使用 random_collect.max_amount)
#
#   简写格式 (直接引用价值别名):
#     物品ID: "@价值别名"
#
# 注意: 物品显示名称自动从 NI 物品库获取，无需手动配置
collect_items:
  # ========== 一阶材料 (价值 4) ==========
  剑痕石:
    value: "@1jie"
    max_amount: 20
  赤铜:
    value: "@1jie"
    max_amount: 25
  精铁:
    value: "@1jie"
    max_amount: 20
  玄阳石:
    value: "@1jie"
    max_amount: 15
  青玉:
    value: "@1jie"
    max_amount: 20
  黎金沙:
    value: "@1jie"
    max_amount: 15
  水云铁:
    value: "@1jie"
    max_amount: 20
  火元石:
    value: "@1jie"
    max_amount: 15
  白藏土:
    value: "@1jie"
    max_amount: 25
  寒冰石:
    value: "@1jie"
    max_amount: 15
  风灵石:
    value: "@1jie"
    max_amount: 15
  雷灵石:
    value: "@1jie"
    max_amount: 15
  一阶朱砂:
    value: "@1jie"
    max_amount: 20

  # ========== 二阶材料 (价值 8) ==========
  玄铁:
    value: "@2jie"
    max_amount: 15
  秘银:
    value: "@2jie"
    max_amount: 12

# ==================== 等级模板库 ====================
# 每个等级定义多个模板，系统随机选取模板生成任务
# 模板配置格式:
#   - id: "模板ID"
#     items:
#       物品ID: {min: 最小数量, max: 最大数量}
#     value_range: [最小价值, 最大价值]
quest_templates:
  # ========== 人级模板池 (价值 10-49) ==========
  rlp:
    - id: "rlp_ore_01"
      items:
        赤铜: {min: 3, max: 8}
        精铁: {min: 2, max: 5}
      value_range: [10, 49]

    - id: "rlp_ore_02"
      items:
        剑痕石: {min: 5, max: 12}
        玄阳石: {min: 2, max: 4}
      value_range: [10, 49]

    - id: "rlp_herb_01"
      items:
        灵草: {min: 4, max: 10}
        白藏土: {min: 3, max: 6}
      value_range: [10, 49]

    - id: "rlp_gem_01"
      items:
        青玉: {min: 3, max: 7}
        寒冰石: {min: 2, max: 5}
      value_range: [10, 49]

  # ========== 玄级模板池 (价值 50-199) ==========
  xlp:
    - id: "xlp_metal_01"
      items:
        玄铁: {min: 3, max: 6}
        秘银: {min: 2, max: 4}
      value_range: [50, 199]

    - id: "xlp_gem_01"
      items:
        星辰石: {min: 2, max: 4}
        龙血玉: {min: 1, max: 3}
      value_range: [50, 199]

    - id: "xlp_mixed_01"
      items:
        玄铁: {min: 4, max: 8}
        风灵石: {min: 3, max: 6}
        雷灵石: {min: 2, max: 4}
      value_range: [50, 199]

  # ========== 地级模板池 (价值 200-499) ==========
  dlp:
    - id: "dlp_rare_01"
      items:
        天外陨铁: {min: 2, max: 4}
        星辰石: {min: 3, max: 5}
      value_range: [200, 499]

    - id: "dlp_mixed_01"
      items:
        混沌晶石: {min: 1, max: 3}
        龙血玉: {min: 2, max: 4}
        天外陨铁: {min: 1, max: 2}
      value_range: [200, 499]

  # ========== 天级模板池 (价值 500+) ==========
  tlp:
    - id: "tlp_legendary_01"
      items:
        太古神石: {min: 1, max: 3}
        混沌晶石: {min: 2, max: 4}
      value_range: [500, 999]

    - id: "tlp_mythic_01"
      items:
        造化玉碟: {min: 1, max: 2}
        鸿蒙紫气: {min: 1, max: 2}
        太古神石: {min: 2, max: 3}
      value_range: [500, 999]

    - id: "tlp_ultimate_01"
      items:
        混沌本源: {min: 1, max: 1}
        造化玉碟: {min: 2, max: 3}
      value_range: [1000, 2000]

# ============================================
# HorizonKKQuestPlus - 悬赏系统配置文件
# ============================================

# ==================== 灵石货币定义 ====================
# key → NI物品ID (通过NeigeItems发放)
stone_types:
  xpls: "下品灵石"
  zpls: "中品灵石"
  spls: "上品灵石"
  jpls: "极品灵石"

# ==================== 悬赏令物品外观 ====================
item:
  # 人级悬赏
  rlp:
    custommodel: 10168
    name: '&f悬赏令 &2[&a人级&2]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '&f{reward}'
  # 玄级悬赏
  xlp:
    custommodel: 10170
    name: '&f悬赏令 &3[&b玄级&3]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '&f{reward}'
  # 地级悬赏
  dlp:
    custommodel: 10167
    name: '&f悬赏令 &5[&d地级&5]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '&f{reward}'
  # 天级悬赏
  tlp:
    custommodel: 10169
    name: '&f悬赏令 &6[&e天级&6]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '&f{reward}'

# ==================== 主菜单配置 ====================
menu:
  size: 27
  # 三个按钮槽位
  public_slot: 11          # 公共悬赏 - 全服共享的委托
  accepted_slot: 13        # 已接取的悬赏
  my_published_slot: 15    # 我发布的悬赏

# ==================== 公共悬赏定时发布 ====================
public_quests:
  interval: 3600           # 发布间隔(秒), 默认1小时
  count: 3                 # 每次发布数量

# ==================== 收集任务随机配置 ====================
random_collect:
  enabled: true            # 是否启用随机收集任务
  min_amount: 5            # 最小收集数量
  max_amount: 50           # 默认最大收集数量 (物品未指定 max_amount 时使用)
  count: 2                 # 每次定时发布时，随机收集任务的数量

# ==================== 价值定义 ====================
# 定义价值常量，供 collect_items 引用
# 使用 @名称 来引用，如: value: "@1jie"
values:
  1jie: 4
  2jie: 8
  3jie: 16
  4jie: 32
  5jie: 64
  6jie: 128
  7jie: 256
  8jie: 512
  9jie: 1024

# ==================== 可收集物品及价值 ====================
# 物品ID → 配置
# 价值决定任务等级:
#   value < 50   → 人级
#   50 ≤ v < 200 → 玄级
#   200 ≤ v < 500 → 地级
#   v ≥ 500      → 天级
#
# 配置格式:
#   完整格式:
#     物品ID:
#       value: 数值 或 "@价值别名"
#       max_amount: 最大数量 (可选，默认使用 random_collect.max_amount)
#
#   简写格式 (直接引用价值别名):
#     物品ID: "@价值别名"
#
# 注意: 物品显示名称自动从 NI 物品库获取，无需手动配置
collect_items:
  # ========== 一阶材料 (价值 4) ==========
  剑痕石:
    value: "@1jie"
    max_amount: 20
  赤铜:
    value: "@1jie"
    max_amount: 25
  精铁:
    value: "@1jie"
    max_amount: 20
  玄阳石:
    value: "@1jie"
    max_amount: 15
  青玉:
    value: "@1jie"
    max_amount: 20
  黎金沙:
    value: "@1jie"
    max_amount: 15
  水云铁:
    value: "@1jie"
    max_amount: 20
  火元石:
    value: "@1jie"
    max_amount: 15
  白藏土:
    value: "@1jie"
    max_amount: 25
  寒冰石:
    value: "@1jie"
    max_amount: 15
  风灵石:
    value: "@1jie"
    max_amount: 15
  雷灵石:
    value: "@1jie"
    max_amount: 15
  一阶朱砂:
    value: "@1jie"
    max_amount: 20

  # ========== 二阶材料 (价值 8) ==========
  玄铁:
    value: "@2jie"
    max_amount: 15
  秘银:
    value: "@2jie"
    max_amount: 12

  # ========== 三阶材料 (价值 16) ==========
  星辰石:
    value: "@3jie"
    max_amount: 10
  龙血玉:
    value: "@3jie"
    max_amount: 8

  # ========== 四阶材料 (价值 32) ==========
  天外陨铁:
    value: "@4jie"
    max_amount: 6

  # ========== 五阶材料 (价值 64) ==========
  混沌晶石:
    value: "@5jie"
    max_amount: 5

  # ========== 高阶材料 ==========
  # 六阶 (价值 128)
  太古神石:
    value: "@6jie"
    max_amount: 4

  # 七阶 (价值 256)
  造化玉碟:
    value: "@7jie"
    max_amount: 3

  # 八阶 (价值 512) - 地级
  鸿蒙紫气:
    value: "@8jie"
    max_amount: 2

  # 九阶 (价值 1024) - 天级
  混沌本源:
    value: "@9jie"
    max_amount: 1

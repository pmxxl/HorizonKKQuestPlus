# ============================================
# HorizonKKQuestPlus - 悬赏系统配置文件
# ============================================

# ==================== 灵石货币定义 ====================
# key → NI物品ID (通过NeigeItems发放)
stone_types:
  xpls: "下品灵石"
  zpls: "中品灵石"
  spls: "上品灵石"
  jpls: "极品灵石"

# ==================== 悬赏令物品外观 ====================
item:
  # 人级悬赏
  rlp:
    custommodel: 10168
    name: '&f悬赏令 &2[&a人级&2]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'
  # 玄级悬赏
  xlp:
    custommodel: 10169
    name: '&f悬赏令 &3[&b玄级&3]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'
  # 地级悬赏
  dlp:
    custommodel: 10170
    name: '&f悬赏令 &5[&d地级&5]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'
  # 天级悬赏
  tlp:
    custommodel: 10171
    name: '&f悬赏令 &6[&e天级&6]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'

# ==================== 主菜单配置 ====================
menu:
  size: 27
  # 三个按钮槽位
  public_slot: 11          # 公共悬赏 - 全服共享的委托
  accepted_slot: 13        # 已接取的悬赏
  my_published_slot: 15    # 我发布的悬赏

# ==================== 公共悬赏定时发布 ====================
public_quests:
  interval: 3600           # 发布间隔(秒), 默认1小时
  count: 3                 # 每次发布数量

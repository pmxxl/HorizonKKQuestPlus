# ============================================
# HorizonKKQuestPlus - 悬赏系统配置文件
# ============================================

# ==================== 灵石货币定义 ====================
# key → NI物品ID (通过NeigeItems发放)
stone_types:
  xpls: "下品灵石"
  zpls: "中品灵石"
  spls: "上品灵石"
  jpls: "极品灵石"

# ==================== 灵石转换阈值 ====================
# 以下品灵石为单位，当奖励价值达到阈值时才转换为更高品灵石
# 例如: threshold_mid: 64 表示价值 >= 64 下品灵石时才给中品灵石
stone_thresholds:
  mid: 500           # 中品灵石阈值 (默认64，即2个中品灵石的价值)
  high: 15360        # 上品灵石阈值 (默认2048，即2个上品灵石的价值)
  top: 491520        # 极品灵石阈值 (默认65536，即2个极品灵石的价值)

# ==================== 奖励浮动倍率 ====================
# 任务奖励会在基础价值 × 倍率范围内随机浮动
# 例如: 基础价值 100，倍率 0.7~1.3，则最终奖励在 70~130 之间
reward_multiplier:
  enabled: true      # 是否启用浮动倍率
  min: 0.7           # 最小倍率 (0.7 = 70%)
  max: 1.3           # 最大倍率 (1.3 = 130%)

# ==================== 接取任务押金 ====================
# 接取任务时需要支付奖励灵石的一定比例作为押金
# 完成任务后押金会返还，未完成则不退还
quest_deposit:
  enabled: true      # 是否启用押金
  rate: 0.08         # 押金费率 (0.08 = 8%)

# ==================== 悬赏令物品外观 ====================
# {reward} 占位符会被替换为奖励列表（每行一个奖励）
# 奖励格式: 奖励名称 &a×数量
item:
  # 人级悬赏
  rlp:
    custommodel: 10168
    name: '&f悬赏令 &2[&a人级&2]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'
  # 玄级悬赏
  xlp:
    custommodel: 10170
    name: '&f悬赏令 &3[&b玄级&3]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'
  # 地级悬赏
  dlp:
    custommodel: 10167
    name: '&f悬赏令 &5[&d地级&5]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'
  # 天级悬赏
  tlp:
    custommodel: 10169
    name: '&f悬赏令 &6[&e天级&6]'
    lore:
      - '&f发布人: {player}'
      - '&7 &7[  &a任务要求  &7]     '
      - '{text}'
      - ''
      - '&7 &7[  &a任务奖励  &7]     '
      - '{reward}'

# ==================== 主菜单配置 ====================
menu:
  size: 27
  # 三个按钮槽位
  public_slot: 11          # 公共悬赏 - 全服共享的委托
  accepted_slot: 13        # 已接取的悬赏
  my_published_slot: 15    # 我发布的悬赏

# ==================== 公共悬赏定时发布 ====================
public_quests:
  interval: 3600           # 发布间隔(秒), 默认1小时
  count: 3                 # 每次发布数量

# ==================== 收集任务随机配置 ====================
random_collect:
  enabled: true            # 是否启用随机收集任务
  min_amount: 5            # 最小收集数量 (单个物品)
  max_amount: 50           # 默认最大收集数量 (单个物品)
  count: 2                 # 每次定时发布时，随机收集任务的数量
  shop_deficit_mode: true
  shop_total_stock: 3000

  # 等级权重 (控制各等级出现概率)
  level_weights:
    rlp: 40              # 人级权重
    xlp: 0            # 玄级权重
    dlp: 0              # 地级权重
    tlp: 0                # 天级权重

# ==================== 价值定义 ====================
# 定义价值常量，供 collect_items 引用
# 使用 @名称 来引用，如: value: "@1jie"
values:
  1jie: 4
  2jie: 12
  1jiecaoyao: 8
  2jiecaoyao: 24

  3jie: 16
  4jie: 32
  5jie: 64
  6jie: 128
  7jie: 256
  8jie: 512
  9jie: 1024

